name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"   # every day
  workflow_dispatch:       # manual run button

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate cards
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release/v0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5   # Pakistan time

      - name: Commit generated cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update profile cards"
          git push
